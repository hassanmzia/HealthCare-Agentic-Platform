services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthapp
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-fhir-db.sql:/docker-entrypoint-initdb.d/init-fhir-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthapp"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [healthnet]
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [healthnet]
    restart: unless-stopped

  backend:
    build: ./backend
    command: bash -lc "./wait_for_db.sh && python manage.py migrate && python manage.py runserver 0.0.0.0:8000 --noreload"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: healthapp
      DB_USER: postgres
      DB_PASSWORD: postgres
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # If you enabled CORS in settings, keep it there; no need here.
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [healthnet]
    restart: unless-stopped

  worker:
    build: ./backend
    command: bash -lc "./wait_for_db.sh && celery -A config.celery:app worker --loglevel=info"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: healthapp
      DB_USER: postgres
      DB_PASSWORD: postgres
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [healthnet]
    restart: unless-stopped

  orchestrator:
    build: ./orchestrator
    command: uvicorn app:app --host 0.0.0.0 --port 8003 --reload
    environment:
      # MCP Server URLs
      MCP_FHIR_ADAPTER_URL: http://mcp-fhir-adapter:8002
      MCP_FHIR_SERVER_URL: http://mcp-fhir-server:8005
      MCP_LABS_SERVER_URL: http://mcp-labs-server:8006
      MCP_RAG_SERVER_URL: http://mcp-rag-server:8007
      MCP_PHARMACY_SERVER_URL: http://mcp-pharmacy-server:8008
      FHIR_BASE: http://hapi-fhir:8080/fhir
      # LLM Configuration
      USE_LLM: "true"
      LLM_PROVIDER: "claude"
      OLLAMA_BASE_URL: "http://host.docker.internal:12434"
      OLLAMA_MODEL: "deepseek-r1:7b"
      CLAUDE_MODEL: "claude-sonnet-4-20250514"
      LLM_TEMPERATURE: "0.3"
      LLM_MAX_TOKENS: "2000"
      # Add your API key via .env file or docker secrets
      # ANTHROPIC_API_KEY: "..."
    volumes:
      - ./orchestrator:/app
    ports:
      - "8003:8003"
    depends_on:
      mcp-fhir-adapter:
        condition: service_started
      mcp-fhir-server:
        condition: service_started
      mcp-labs-server:
        condition: service_started
      mcp-rag-server:
        condition: service_started
      redis:
        condition: service_healthy
    networks: [healthnet]
    restart: unless-stopped

  hapi-fhir:
    image: hapiproject/hapi:latest
    environment:
      spring.datasource.url: jdbc:postgresql://db:5432/hapi_fhir
      spring.datasource.username: postgres
      spring.datasource.password: postgres
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hapi.fhir.allow_external_references: "true"
      hapi.fhir.expunge_enabled: "true"
    ports:
      - "18090:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [healthnet]
    restart: unless-stopped

  mcp-fhir-adapter:
    build: ./mcp/tool_adapters/fhir_writeback
    command: uvicorn app:app --host 0.0.0.0 --port 8002
    environment:
      FHIR_BASE: "http://hapi-fhir:8080/fhir"
    ports:
      - "8002:8002"
    depends_on:
      hapi-fhir:
        condition: service_started
    networks: [healthnet]
    restart: unless-stopped

  # MCP FHIR Server - FHIR data access for agents
  mcp-fhir-server:
    build: ./mcp/servers
    command: uvicorn mcp_fhir_server:app --host 0.0.0.0 --port 8005 --reload
    environment:
      FHIR_BASE: "http://hapi-fhir:8080/fhir"
    volumes:
      - ./mcp/servers:/app
    ports:
      - "8005:8005"
    depends_on:
      hapi-fhir:
        condition: service_started
    networks: [healthnet]
    restart: unless-stopped

  # MCP Labs Server - Lab results with interpretation
  mcp-labs-server:
    build: ./mcp/servers
    command: uvicorn mcp_labs_server:app --host 0.0.0.0 --port 8006 --reload
    environment:
      FHIR_BASE: "http://hapi-fhir:8080/fhir"
    volumes:
      - ./mcp/servers:/app
    ports:
      - "8006:8006"
    depends_on:
      hapi-fhir:
        condition: service_started
    networks: [healthnet]
    restart: unless-stopped

  # MCP RAG Server - Clinical guidelines and knowledge base
  mcp-rag-server:
    build: ./mcp/servers
    command: uvicorn mcp_rag_server:app --host 0.0.0.0 --port 8007 --reload
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      - ./mcp/servers:/app
    ports:
      - "8007:8007"
    depends_on:
      chromadb:
        condition: service_started
    networks: [healthnet]
    restart: unless-stopped

  # MCP Pharmacy Server - Drug formulary and prescriptions
  mcp-pharmacy-server:
    build: ./mcp/servers
    command: uvicorn mcp_pharmacy_server:app --host 0.0.0.0 --port 8008 --reload
    environment:
      FHIR_BASE: "http://hapi-fhir:8080/fhir"
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REQUIRE_AUTH: "false"
      JWT_SECRET: "change-this-in-production"
    volumes:
      - ./mcp/servers:/app
    ports:
      - "8008:8008"
    depends_on:
      hapi-fhir:
        condition: service_started
      db:
        condition: service_healthy
    networks: [healthnet]
    restart: unless-stopped

  # ChromaDB - Vector database for RAG
  chromadb:
    image: chromadb/chroma:latest
    environment:
      CHROMA_SERVER_AUTH_PROVIDER: ""
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - chromadata:/chroma/chroma
    ports:
      - "8009:8000"
    networks: [healthnet]
    restart: unless-stopped

  clinician-ui:
    build:
      context: ./frontend/clinician-dashboard
      dockerfile: Dockerfile
    ports:
      - "3030:443"
      - "2080:80"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_started
      hapi-fhir:
        condition: service_started
      orchestrator:
        condition: service_started
    networks: [healthnet]
    restart: unless-stopped

  iot-simulator:
    build: ./iot-simulator
    command: uvicorn app:app --host 0.0.0.0 --port 8004
    environment:
      BACKEND_URL: http://backend:8000
      MCP_ADAPTER_URL: http://mcp-fhir-adapter:8002
      ORCHESTRATOR_URL: http://orchestrator:8003
      DEFAULT_INTERVAL: "30"
      AUTO_START: "false"
      ENABLE_ALERTS: "true"
      ENABLE_AI_RECOMMENDATIONS: "true"
    ports:
      - "8004:8004"
    depends_on:
      backend:
        condition: service_started
      mcp-fhir-adapter:
        condition: service_started
      orchestrator:
        condition: service_started
    networks: [healthnet]
    restart: unless-stopped

networks:
  healthnet:

volumes:
  pgdata:
  chromadata:

