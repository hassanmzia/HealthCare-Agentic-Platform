version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16 
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthapp
    ports: ["5432:5432"]

  redis:
    image: redis:7

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes: [./backend:/app]
    ports: ["8000:8000"]
    depends_on: [db, redis]

  worker:
    build: ./backend
    command: celery -A config worker --loglevel=info
    depends_on: [backend, redis]

  orchestrator:
    build: ./orchestrator
    command: uvicorn app:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]

  mcp-server:
    image: teradata/mcp-server:latest
    ports: ["8002:8002"]

  hapi-fhir:
    image: hapiproject/hapi:latest
    ports: ["8080:8080"]

  mcp-fhir-adapter:
    build: ./mcp/tool_adapters/fhir_writeback
    command: uvicorn app:app --host 0.0.0.0 --port 8002
    environment:
      FHIR_BASE: "http://hapi-fhir:8080/fhir"
    ports: ["8002:8002"]
    depends_on: [hapi-fhir]

